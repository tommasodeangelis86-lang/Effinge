# Pubblicazione su Netlify: a ogni modifica salvata dal pannello il sito si ricostruisce da solo.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Le bozze non vanno indicizzate
[[headers]]
  for = "/anteprima/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# CSS e JS: nessuna memoria lunga (gli indirizzi hanno ?v=versione). Solo font e librerie,
# che non cambiano mai, restano in memoria a lungo.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Scorciatoia per l'autore: effinge.it/admin apre il pannello di gestione (Pages CMS)
[[redirects]]
  from = "/admin"
  to = "https://app.pagescms.org/"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "https://app.pagescms.org/"
  status = 302
