# Pannello di gestione di Effinge (Pages CMS — https://app.pagescms.org)
# Ogni salvataggio crea un commit su GitHub e avvia la pubblicazione su GitHub Pages.

media:
  input: media
  output: /media
  # solo foto: niente SVG, che può contenere codice eseguibile
  extensions: [jpg, jpeg, png, webp, gif, avif]

content:
  - name: testi
    label: Testi
    description: I testi pubblicati su Effinge. Spunta «Bozza» per lavorarci senza pubblicarli.
    type: collection
    path: src/testi
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [titolo, categoria, date, bozza]
      primary: titolo
      sort: [date, titolo]
      default:
        sort: date
        order: desc
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: date
        label: Data di pubblicazione
        type: date
        required: true
      - name: categoria
        label: Categoria
        description: Per esempio Racconto, Frammento, Prosa breve, Nota. Serve anche per i filtri dell’archivio.
        type: string
      - name: estratto
        label: Estratto
        description: Due o tre righe mostrate in homepage e nelle anteprime sui social.
        type: text
      - name: in_evidenza
        label: In evidenza in homepage
        type: boolean
        default: false
      - name: bozza
        label: Bozza (non pubblicato)
        description: "Una bozza non compare nel sito. Puoi vederla in anteprima all’indirizzo /anteprima/ seguito dal nome del file, senza la data (es. /anteprima/il-mio-testo/)."
        type: boolean
        default: true
      - name: colore_carta
        label: Colore della carta (facoltativo)
        description: "Solo per questo testo. Codice colore, per esempio #ECE7DC (avorio), #F3F1EC (bianco), #E4DED2 (sabbia), #DCD9D2 (grigio perla). Vuoto = colore generale."
        type: string
        pattern:
          regex: "^(#[0-9a-fA-F]{6})?$"
          message: "Scrivi un codice colore come #ECE7DC, oppure lascia vuoto."
      - name: immagine
        label: Immagine (facoltativa)
        type: image
      - name: immagine_alt
        label: Descrizione dell’immagine
        description: Per chi non vede l’immagine. Lascia vuoto se è solo decorativa.
        type: string
      - name: seo_titolo
        label: Titolo per Google (facoltativo)
        type: string
      - name: seo_descrizione
        label: Descrizione per Google (facoltativa)
        type: text
      - name: body
        label: Testo
        type: rich-text
        options:
          format: markdown

  - name: pagine
    label: Pagine
    description: Pagine libere, come Il progetto e Contatti. Creane una nuova per aggiungere una pagina al sito.
    type: collection
    path: src/pagine
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [titolo, nel_menu, ordine]
      primary: titolo
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: nel_menu
        label: Mostra nel menu in alto
        type: boolean
        default: true
      - name: ordine
        label: Posizione nel menu
        description: 1 = prima, 2 = seconda, e così via.
        type: number
        default: 3
      - name: bozza
        label: Bozza (non pubblicata)
        type: boolean
        default: false
      - name: colore_carta
        label: Colore della carta (facoltativo)
        type: string
        pattern:
          regex: "^(#[0-9a-fA-F]{6})?$"
          message: "Scrivi un codice colore come #ECE7DC, oppure lascia vuoto."
      - name: seo_descrizione
        label: Descrizione per Google
        type: text
      - name: body
        label: Testo
        type: rich-text
        options:
          format: markdown

  - name: art
    label: Effinge Art
    description: I testi della galleria e le schede dei quadri.
    type: file
    path: src/_data/effingeArt.json
    format: json
    fields:
      - { name: contatto, label: Email per le informazioni, type: string, required: true }
      - name: presentazione
        label: Presentazione (in apertura)
        description: Un paragrafo per riquadro. Si scrivono sotto la lampada quando la pagina si apre.
        type: text
        list: true
      - { name: commissioni, label: Commissioni, type: text, description: "Il testo sopra il pulsante «Scrivici per informazioni»." }
      - name: social
        label: Social
        description: "Compaiono sotto la presentazione dell’artista. Per esempio nome Instagram, indirizzo https://www.instagram.com/…"
        type: object
        list: true
        fields:
          - { name: nome, label: Nome, type: string, required: true }
          - { name: indirizzo, label: Indirizzo, type: string, required: true, pattern: { regex: "^https://", message: "L’indirizzo deve cominciare con https://" } }
      - { name: titolo_opere, label: Titolo della galleria, type: string }
      - { name: titolo_evento, label: Titolo della foto dell’evento, type: string }
      - { name: titolo_altre, label: Titolo «Altre opere», type: string }
      - name: opere
        label: Quadri
        description: L’ordine qui è l’ordine nella galleria. Tocca un quadro per aprirne la scheda.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.titolo}"
        fields:
          - { name: titolo, label: Titolo, type: string, required: true }
          - { name: slug, label: Nome nell’indirizzo, type: string, required: true, description: "Solo minuscole e trattini, per esempio la-valle-di-chelm. Diventa /art/opere/la-valle-di-chelm/. Non cambiarlo per i quadri già pubblicati." , pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Solo lettere minuscole, numeri e trattini." } }
          - { name: immagine, label: Foto del quadro, type: image, description: "Solo per i quadri nuovi: quelli già presenti usano la loro foto." }
          - { name: alt, label: Descrizione della foto, type: string, description: "Cosa si vede nel quadro, per chi non vede l’immagine." }
          - { name: sommario, label: Sottotitolo, type: string }
          - { name: contesto, label: Anno e luogo, type: string }
          - name: stato
            label: Stato
            type: select
            options:
              values:
                - { value: Disponibile, label: Disponibile }
                - { value: Venduto, label: Venduto }
          - { name: nel_mosaico, label: Nel mosaico in apertura, type: boolean, description: "Il mosaico è fatto per 12 quadri." }
          - { name: altra, label: Va in «Altre opere», type: boolean }
          - { name: fotoADestra, label: Foto a destra nella sua pagina, type: boolean }
          - name: testo
            label: Descrizione del quadro
            description: Un paragrafo per riquadro.
            type: text
            list: true
          - { name: width, label: "Larghezza della foto (pixel, facoltativa)", type: number }
          - { name: height, label: "Altezza della foto (pixel, facoltativa)", type: number }

  - name: impostazioni
    label: Impostazioni del sito
    description: Apertura, animazione, lampada, colori e homepage.
    type: file
    path: src/_data/impostazioni.json
    format: json
    fields:
      - name: sito
        label: Sito
        type: object
        fields:
          - { name: nome, label: Nome del sito, type: string, required: true }
          - { name: titolo_home, label: Titolo della homepage su Google, type: string, description: "Compare come titolo blu nei risultati di Google (circa 60 caratteri)." }
          - { name: descrizione, label: Descrizione della homepage su Google, type: text, description: "Compare sotto il titolo nei risultati di Google (circa 155 caratteri)." }
          - { name: indirizzo, label: Indirizzo del sito, type: string, description: "Per esempio https://effinge.it" }
          - { name: indicizza, label: "Visibile su Google", type: boolean, description: "Attivalo solo quando il sito è pronto e collegato a effinge.it." }
          - { name: piede, label: Testo a piè di pagina, type: string }
      - name: apertura
        label: Apertura della homepage
        type: object
        fields:
          - { name: scritta, label: Scritta animata, type: string, required: true, options: { maxlength: 18 } }
          - { name: sottotitolo, label: Sottotitolo, type: string }
          - { name: intestazione_sinistra, label: "Intestazione del foglio (sinistra)", type: string }
          - { name: intestazione_destra, label: "Intestazione del foglio (destra)", type: string }
          - { name: firma_sinistra, label: "Piede del foglio (sinistra)", type: string }
          - { name: firma_destra, label: "Piede del foglio (destra)", type: string }
      - name: animazione
        label: Animazione della scritta
        type: object
        fields:
          - { name: attiva, label: Animazione attiva, type: boolean }
          - { name: velocita, label: "Velocità (millisecondi per lettera)", type: number, description: "Più basso = più veloce. Consigliato 70–120.", options: { min: 30, max: 400, step: 5 } }
          - { name: ritardo, label: "Attesa prima di iniziare (ms)", type: number, options: { min: 0, max: 2000, step: 50 } }
          - { name: dissolvenza, label: "Durata della luce su ogni lettera (ms)", type: number, description: "Consigliato 220–400.", options: { min: 120, max: 1200, step: 20 } }
          - { name: cursore, label: Mostra il cursore mentre scrive, type: boolean }
          - name: ripetizione
            label: Quando ripetere l’animazione
            type: select
            options:
              values:
                - { value: sempre, label: "A ogni visita della homepage" }
                - { value: sessione, label: "Una volta per visita (non a ogni ritorno)" }
      - name: lampada
        label: Lampada
        type: object
        fields:
          - name: colore
            label: Colore della luce
            description: "#F0CB8A candela (predefinito), #F5DDB0 caldo tenue, #E8E4D8 luce bianca, #E9B97A ambra."
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Scrivi un codice colore come #F0CB8A."
          - { name: intensita, label: "Intensità della luce (0–100)", type: number, description: "Più basso = lampada più fioca.", options: { min: 0, max: 100, step: 5 } }
      - name: colori
        label: Colori
        type: object
        fields:
          - name: sfondo
            label: Sfondo del sito (predefinito)
            description: Quello che vede chi arriva. Ogni visitatore può cambiarlo con il tondino in alto a destra.
            type: select
            options:
              values:
                - { value: grafite, label: "Grafite (grigio, predefinito)" }
                - { value: vicious-stance, label: "Vicious Stance (ardesia)" }
                - { value: eternal-constance, label: "Eternal Constance (blu notte)" }
                - { value: midnight-bloom, label: "Midnight Bloom (viola e petrolio)" }
                - { value: solid-stone, label: "Solid Stone (blu e azzurro)" }
                - { value: blu-effinge, label: "Blu Effinge" }
          - name: buio
            label: Quanto è scuro lo sfondo (0–100)
            description: "0 = lo sfumato com'è, 100 = nero assoluto. Ogni visitatore può cambiarlo con il cursore nel tondino in alto."
            type: number
            options: { min: 0, max: 100, step: 5 }
          - name: stanza
            label: Colore della stanza (sfondo)
            type: string
            pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Scrivi un codice colore come #0A0A09." }
          - name: carta
            label: Colore della carta
            description: "#ECE7DC avorio (predefinito), #F3F1EC bianco, #E4DED2 sabbia, #DCD9D2 grigio perla."
            type: string
            pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Scrivi un codice colore come #ECE7DC." }
          - name: inchiostro
            label: Colore dell’inchiostro
            type: string
            pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Scrivi un codice colore come #1A1916." }
          - name: testo
            label: Colore del testo sullo sfondo
            type: string
            pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "Scrivi un codice colore come #E9E5DB." }
      - name: progetto
        label: Presentazione sul foglio d’apertura
        type: object
        fields:
          - { name: mostra, label: Mostra la presentazione, type: boolean }
          - { name: titolo, label: Titolo per lettori di schermo, type: string }
          - { name: righe, label: Righe, type: string, list: true }
      - name: home
        label: Homepage
        type: object
        fields:
          - { name: mostra_ultimo, label: Mostra «Quaderni», type: boolean }
          - { name: mostra_archivio, label: Mostra «Dall’archivio», type: boolean }
          - { name: quanti_in_archivio, label: Quanti testi in «Dall’archivio», type: number, options: { min: 1, max: 12 } }
          - { name: congedo, label: Frase finale, type: string }
          - name: scrivi
            label: Scrivi (sezione in homepage e voce di menu)
            type: object
            fields:
              - { name: mostra, label: Mostra la sezione in homepage, type: boolean }
              - { name: nel_menu, label: Mostra «Scrivi» nel menu in alto, type: boolean }
              - { name: titolo, label: Titolo della sezione, type: string }
              - { name: testo, label: Testo della sezione, type: text }
              - { name: pulsante, label: Testo del pulsante, type: string }
              - { name: frase_foglio, label: Frase che si scrive sul foglietto, type: string, options: { maxlength: 40 } }
