# Pubblica il sito su GitHub Pages a ogni modifica di main (pannello, Scrivi o codice).
# Per attivarlo: GitHub → Settings → Pages → Source: «GitHub Actions».
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# se arrivano più modifiche di fila, si pubblica solo l'ultima
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          EFFINGE_SUPABASE_URL: https://kvmwiggttjyggjlmeben.supabase.co
          EFFINGE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_7AUzFO54WlaWtB09F2dj8g_41JHBzRS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
